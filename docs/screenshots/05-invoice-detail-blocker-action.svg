<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <rect width="1200" height="800" fill="#F2F2F7"/>
  <g transform="translate(160, 80)">
    <text x="0" y="20" font-family="-apple-system, Inter, sans-serif" font-size="13" fill="#007AFF">‹ Invoices</text>
    <text x="0" y="55" font-family="-apple-system, Inter, sans-serif" font-weight="700" font-size="28" fill="#1C1C1E">Orbit Labs · INV-OL-07</text>
    <text x="0" y="115" font-family="-apple-system, Inter, sans-serif" font-weight="200" font-size="56" fill="#1C1C1E">£15,000.00</text>
    <text x="0" y="145" font-family="-apple-system, Inter, sans-serif" font-size="13" fill="#8E8E93">due 12 Nov 2026 · 4 days overdue</text>
    <!-- Tabs -->
    <rect x="0" y="180" width="500" height="38" rx="19" fill="#E5E5EA"/>
    <rect x="100" y="182" width="100" height="34" rx="17" fill="#FFFFFF"/>
    <text x="50" y="204" font-family="-apple-system, Inter, sans-serif" font-size="13" fill="#8E8E93" text-anchor="middle">Timeline</text>
    <text x="150" y="204" font-family="-apple-system, Inter, sans-serif" font-weight="600" font-size="13" fill="#1C1C1E" text-anchor="middle">Blockers</text>
    <text x="250" y="204" font-family="-apple-system, Inter, sans-serif" font-size="13" fill="#8E8E93" text-anchor="middle">Payments</text>
    <text x="350" y="204" font-family="-apple-system, Inter, sans-serif" font-size="13" fill="#8E8E93" text-anchor="middle">Documents</text>
    <text x="450" y="204" font-family="-apple-system, Inter, sans-serif" font-size="13" fill="#8E8E93" text-anchor="middle">Reminder</text>
    <!-- Blocker Card with connector -->
    <rect x="0" y="250" width="880" height="90" rx="20" fill="#FFFFFF" stroke="#E5E5EA"/>
    <circle cx="36" cy="295" r="10" fill="#FF9500"/>
    <text x="60" y="290" font-family="-apple-system, Inter, sans-serif" font-weight="600" font-size="15" fill="#1C1C1E">Bank Details Invalid</text>
    <text x="60" y="310" font-family="-apple-system, Inter, sans-serif" font-size="12" fill="#8E8E93">Vendor bank sort code mismatch in AP system · Raised 10 Nov</text>
    <!-- Connector line -->
    <line x1="36" y1="340" x2="36" y2="390" stroke="#007AFF" stroke-width="2.5"/>
    <rect x="60" y="370" width="820" height="80" rx="16" fill="rgba(0,122,255,0.05)" stroke="rgba(0,122,255,0.2)"/>
    <text x="85" y="400" font-family="-apple-system, Inter, sans-serif" font-weight="700" font-size="11" fill="#007AFF">GENERATED NEXT ACTION</text>
    <text x="85" y="425" font-family="-apple-system, Inter, sans-serif" font-weight="500" font-size="14" fill="#1C1C1E">Provide signed bank account confirmation letter to AP clerk</text>
  </g>
</svg>