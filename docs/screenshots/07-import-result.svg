<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <rect width="1200" height="800" fill="#F2F2F7"/>
  <g transform="translate(200, 100)">
    <text x="0" y="35" font-family="-apple-system, Inter, sans-serif" font-weight="700" font-size="34" fill="#1C1C1E">Import Invoices</text>
    <text x="0" y="65" font-family="-apple-system, Inter, sans-serif" font-size="14" fill="#8E8E93">Batch invoice CSV file validation results.</text>
    <!-- Result Tiles -->
    <rect x="0" y="100" width="250" height="110" rx="24" fill="#FFFFFF" stroke="#E5E5EA"/>
    <text x="24" y="130" font-family="-apple-system, Inter, sans-serif" font-size="11" font-weight="700" fill="#8E8E93">PROCESSED</text>
    <text x="24" y="180" font-family="-apple-system, Inter, sans-serif" font-weight="200" font-size="40" fill="#1C1C1E">25</text>
    <rect x="275" y="100" width="250" height="110" rx="24" fill="#FFFFFF" stroke="#E5E5EA"/>
    <text x="299" y="130" font-family="-apple-system, Inter, sans-serif" font-size="11" font-weight="700" fill="#34C759">IMPORTED</text>
    <text x="299" y="180" font-family="-apple-system, Inter, sans-serif" font-weight="200" font-size="40" fill="#34C759">23</text>
    <rect x="550" y="100" width="250" height="110" rx="24" fill="#FFFFFF" stroke="#E5E5EA"/>
    <text x="574" y="130" font-family="-apple-system, Inter, sans-serif" font-size="11" font-weight="700" fill="#FF3B30">REJECTED</text>
    <text x="574" y="180" font-family="-apple-system, Inter, sans-serif" font-weight="200" font-size="40" fill="#FF3B30">2</text>
    <!-- Row Errors -->
    <rect x="0" y="240" width="800" height="80" rx="20" fill="#FFFFFF" stroke="#E5E5EA"/>
    <circle cx="36" cy="280" r="8" fill="#FF3B30"/>
    <text x="56" y="275" font-family="-apple-system, Inter, sans-serif" font-weight="600" font-size="14" fill="#1C1C1E">Row 14</text>
    <text x="56" y="295" font-family="-apple-system, Inter, sans-serif" font-size="12" fill="#FF3B30">Negative invoice amount: -500.00</text>
  </g>
</svg>