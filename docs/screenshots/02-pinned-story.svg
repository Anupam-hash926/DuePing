<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <rect width="1200" height="800" fill="#F2F2F7"/>
  <text x="120" y="180" font-family="-apple-system, Inter, sans-serif" font-weight="200" font-size="52" fill="#1C1C1E">Find the cause.</text>
  <text x="120" y="240" font-family="-apple-system, Inter, sans-serif" font-weight="300" font-size="52" fill="#007AFF">Get the next move.</text>
  <text x="120" y="300" font-family="-apple-system, Inter, sans-serif" font-size="17" fill="#636366" max-width="400">
    DuePing pairs root-cause blockers directly with generated next actions from the playbook.
  </text>
  <!-- Interactive Visual Card Mock -->
  <g transform="translate(620, 200)">
    <rect width="480" height="380" rx="28" fill="#FFFFFF" stroke="#E5E5EA" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.05))"/>
    <text x="40" y="50" font-family="-apple-system, Inter, sans-serif" font-weight="700" font-size="16" fill="#1C1C1E">Invoice INV-GL-05</text>
    <rect x="40" y="80" width="400" height="80" rx="16" fill="#F2F2F7" stroke="#E5E5EA"/>
    <circle cx="65" cy="120" r="10" fill="#FF9500"/>
    <text x="90" y="115" font-family="-apple-system, Inter, sans-serif" font-weight="600" font-size="14" fill="#1C1C1E">Missing PO Number</text>
    <text x="90" y="135" font-family="-apple-system, Inter, sans-serif" font-size="12" fill="#8E8E93">Client AP requires valid PO before remittance</text>
    <!-- Connector line -->
    <path d="M 65 160 L 65 210 L 90 210" fill="none" stroke="#007AFF" stroke-width="2.5" stroke-dasharray="4 4"/>
    <rect x="90" y="185" width="350" height="90" rx="16" fill="rgba(0,122,255,0.06)" stroke="rgba(0,122,255,0.2)"/>
    <text x="110" y="215" font-family="-apple-system, Inter, sans-serif" font-weight="600" font-size="13" fill="#007AFF">GENERATED NEXT ACTION</text>
    <text x="110" y="240" font-family="-apple-system, Inter, sans-serif" font-weight="500" font-size="14" fill="#1C1C1E">Request procurement PO number from contact</text>
  </g>
</svg>