<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <rect width="1200" height="800" fill="#F2F2F7"/>
  <g transform="translate(240, 150)">
    <rect width="720" height="480" rx="28" fill="#FFFFFF" stroke="#E5E5EA" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.06))"/>
    <text x="40" y="55" font-family="-apple-system, Inter, sans-serif" font-weight="700" font-size="20" fill="#1C1C1E">Dynamic Reminder Generator</text>
    <text x="40" y="80" font-family="-apple-system, Inter, sans-serif" font-size="13" fill="#8E8E93">Subject: Regarding outstanding invoice INV-2026-001</text>
    <!-- Tone Segmented Control -->
    <rect x="40" y="110" width="280" height="36" rx="18" fill="#E5E5EA"/>
    <rect x="42" y="112" width="90" height="32" rx="16" fill="#FFFFFF"/>
    <text x="87" y="132" font-family="-apple-system, Inter, sans-serif" font-weight="600" font-size="12" fill="#1C1C1E" text-anchor="middle">Polite</text>
    <text x="180" y="132" font-family="-apple-system, Inter, sans-serif" font-size="12" fill="#8E8E93" text-anchor="middle">Firm</text>
    <text x="270" y="132" font-family="-apple-system, Inter, sans-serif" font-size="12" fill="#8E8E93" text-anchor="middle">Final</text>
    <!-- Chat Bubble -->
    <rect x="40" y="170" width="640" height="190" rx="20" fill="#007AFF"/>
    <text x="70" y="210" font-family="-apple-system, Inter, sans-serif" font-weight="400" font-size="15" fill="#FFFFFF" line-height="24">
      <tspan x="70" dy="0">Dear Finance Team,</tspan>
      <tspan x="70" dy="28">We are writing to gently remind you that invoice INV-2026-001 for £1,000.00 is due.</tspan>
      <tspan x="70" dy="28">Please let us know once remittance has been scheduled.</tspan>
      <tspan x="70" dy="28">Thank you for your prompt attention.</tspan>
    </text>
    <!-- Action buttons -->
    <rect x="40" y="390" width="110" height="40" rx="20" fill="#F2F2F7" stroke="#E5E5EA"/>
    <text x="95" y="415" font-family="-apple-system, Inter, sans-serif" font-weight="600" font-size="13" fill="#1C1C1E" text-anchor="middle">Copy Text</text>
    <rect x="165" y="390" width="130" height="40" rx="20" fill="#007AFF"/>
    <text x="230" y="415" font-family="-apple-system, Inter, sans-serif" font-weight="600" font-size="13" fill="#FFFFFF" text-anchor="middle">Mark as Sent ›</text>
  </g>
</svg>