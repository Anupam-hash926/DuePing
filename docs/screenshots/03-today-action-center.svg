    <text x="175" y="292" font-family="-apple-system, Inter, sans-serif" font-size="13" fill="#8E8E93">Outstanding: <tspan font-weight="600" fill="#1C1C1E">GBP 22,000.00</tspan></text>
    <line x1="36" y1="330" x2="844" y2="330" stroke="#E5E5EA"/>
    <rect x="36" y="348" width="90" height="36" rx="18" fill="#007AFF"/>
    <text x="81" y="371" font-family="-apple-system, Inter, sans-serif" font-weight="600" font-size="13" fill="#FFFFFF" text-anchor="middle">✓ Done</text>
    <text x="160" y="371" font-family="-apple-system, Inter, sans-serif" font-size="14" fill="#007AFF" font-weight="500">Reschedule</text>
    <text x="270" y="371" font-family="-apple-system, Inter, sans-serif" font-size="14" fill="#007AFF" font-weight="500">Open invoice ›</text>
