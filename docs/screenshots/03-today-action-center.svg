    <rect x="0" y="150" width="880" height="250" rx="28" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1.5" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.04))"/>
    <circle cx="36" cy="186" r="5" fill="#FF3B30"/>
    <text x="50" y="190" font-family="-apple-system, Inter, sans-serif" font-weight="600" font-size="15" fill="#007AFF">INV-SR-11</text>
    <text x="145" y="190" font-family="-apple-system, Inter, sans-serif" font-size="15" fill="#8E8E93">·</text>
    <text x="160" y="190" font-family="-apple-system, Inter, sans-serif" font-weight="600" font-size="15" fill="#1C1C1E">Sunrise Retail</text>
    <text x="800" y="190" font-family="-apple-system, Inter, sans-serif" font-size="13" fill="#8E8E93">1 of 4</text>
    <text x="36" y="250" font-family="-apple-system, Inter, sans-serif" font-weight="300" font-size="32" fill="#1C1C1E">Escalate final legal notice for 100d overdue balance</text>
    <rect x="36" y="275" width="120" height="26" rx="13" fill="rgba(255,59,48,0.1)"/>
