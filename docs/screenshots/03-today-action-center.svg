<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <rect width="1200" height="800" fill="#F2F2F7"/>
  <rect x="0" y="0" width="1200" height="64" fill="rgba(255,255,255,0.8)" stroke="#E5E5EA"/>
  <text x="80" y="38" font-family="-apple-system, Inter, sans-serif" font-weight="700" font-size="18" fill="#1C1C1E">DuePing · Today</text>
  <g transform="translate(160, 100)">
    <text x="0" y="40" font-family="-apple-system, Inter, sans-serif" font-weight="700" font-size="34" fill="#1C1C1E">Today</text>
