    <!-- Strategy pill -->
    <rect x="0" y="90" width="360" height="36" rx="18" fill="#E5E5EA"/>
    <rect x="2" y="92" width="120" height="32" rx="16" fill="#FFFFFF"/>
    <text x="62" y="112" font-family="-apple-system, Inter, sans-serif" font-weight="600" font-size="12" fill="#1C1C1E" text-anchor="middle">Risk-weighted</text>
    <text x="180" y="112" font-family="-apple-system, Inter, sans-serif" font-size="12" fill="#8E8E93" text-anchor="middle">Largest amount</text>
    <text x="300" y="112" font-family="-apple-system, Inter, sans-serif" font-size="12" fill="#8E8E93" text-anchor="middle">Most overdue</text>
