<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <rect width="1200" height="800" fill="#F2F2F7"/>
  <!-- Ambient Gradient Blobs -->
  <circle cx="350" cy="250" r="280" fill="#007AFF" opacity="0.08" filter="blur(60px)"/>
  <circle cx="850" cy="550" r="240" fill="#5856D6" opacity="0.08" filter="blur(60px)"/>
  <!-- Top Navigation -->
  <rect x="0" y="0" width="1200" height="64" fill="rgba(255,255,255,0.75)" stroke="#E5E5EA"/>
  <circle cx="60" cy="32" r="14" fill="#007AFF" opacity="0.2"/>
  <circle cx="60" cy="32" r="6" fill="#007AFF"/>
  <text x="86" y="38" font-family="-apple-system, Inter, sans-serif" font-weight="700" font-size="18" fill="#1C1C1E">DuePing</text>
  <rect x="1040" y="16" width="120" height="32" rx="16" fill="#007AFF"/>
  <text x="1100" y="37" font-family="-apple-system, Inter, sans-serif" font-weight="600" font-size="13" fill="#FFFFFF" text-anchor="middle">Open App</text>
  <!-- Hero Content -->
  <text x="600" y="240" font-family="-apple-system, Inter, sans-serif" font-weight="200" font-size="76" fill="#1C1C1E" text-anchor="middle" letter-spacing="-2">Get paid.</text>
  <text x="600" y="325" font-family="-apple-system, Inter, sans-serif" font-weight="300" font-size="76" fill="#007AFF" text-anchor="middle" letter-spacing="-2">Not ignored.</text>
  <text x="600" y="390" font-family="-apple-system, Inter, sans-serif" font-weight="400" font-size="19" fill="#8E8E93" text-anchor="middle">DuePing finds out why an invoice is stuck — and tells you what to do next.</text>
  <!-- Floating Glass Action Card -->
  <g transform="translate(360, 440)">
    <rect width="480" height="240" rx="28" fill="rgba(255,255,255,0.85)" stroke="#E5E5EA" stroke-width="1.5" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.06))"/>
    <circle cx="40" cy="40" r="5" fill="#FF9500"/>
    <text x="56" y="44" font-family="-apple-system, Inter, sans-serif" font-weight="600" font-size="14" fill="#007AFF">INV-2026-007</text>
    <text x="175" y="44" font-family="-apple-system, Inter, sans-serif" font-size="14" fill="#8E8E93">·</text>
    <text x="190" y="44" font-family="-apple-system, Inter, sans-serif" font-weight="600" font-size="14" fill="#1C1C1E">Orbit Labs</text>
    <text x="40" y="105" font-family="-apple-system, Inter, sans-serif" font-weight="300" font-size="26" fill="#1C1C1E">Send updated banking details to AP</text>
    <rect x="40" y="130" width="130" height="24" rx="12" fill="#F2F2F7" stroke="#E5E5EA"/>
    <text x="105" y="146" font-family="-apple-system, Inter, sans-serif" font-size="11" fill="#636366" text-anchor="middle">WRONG_DETAILS</text>
    <rect x="180" y="130" width="100" height="24" rx="12" fill="rgba(255,59,48,0.1)"/>
    <text x="230" y="146" font-family="-apple-system, Inter, sans-serif" font-size="11" fill="#FF3B30" font-weight="600" text-anchor="middle">4d overdue</text>
    <line x1="40" y1="180" x2="440" y2="180" stroke="#E5E5EA"/>
    <rect x="40" y="195" width="80" height="32" rx="16" fill="#007AFF"/>
    <text x="80" y="215" font-family="-apple-system, Inter, sans-serif" font-weight="600" font-size="13" fill="#FFFFFF" text-anchor="middle">Done</text>
    <text x="160" y="215" font-family="-apple-system, Inter, sans-serif" font-size="13" fill="#007AFF" font-weight="500">Reschedule ›</text>
  </g>
</svg>